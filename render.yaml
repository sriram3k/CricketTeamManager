services:
  - type: web
    name: cricketteammanager
    runtime: node
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cricketteammanager-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: cricketteammanager-db
    databaseName: cricketteammanager
    plan: free

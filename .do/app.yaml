name: crickiq
region: nyc

services:
  - name: web
    github:
      repo: sriram3k/cricketteammanager
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    routes:
      - path: /
    health_check:
      http_path: /api/auth/user
      initial_delay_seconds: 15
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8080"
        scope: RUN_AND_BUILD_TIME
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SENDGRID_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FROM_EMAIL
        scope: RUN_TIME
        type: SECRET

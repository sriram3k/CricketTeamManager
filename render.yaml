services:
  - type: web
    name: cricketteammanager
    runtime: node
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard from Neon.tech
      - key: SESSION_SECRET
        generateValue: true
